<div class="auth-wrapper">
  <div class="card overflow-hidden">

    <div class="card-header">
      <h1 class="card-title">Dobrodošli</h1>
      <p class="card-sub">Prijavite se da biste nastavili.</p>
    </div>

    <div class="card-body">

      <div *ngIf="message" class="alert" [ngClass]="success ? 'alert-success' : 'alert-error'">
        {{ message }}
      </div>

      <div class="field">
        <label class="label">Email</label>
        <input class="input" [(ngModel)]="email" type="email"
               placeholder="ime@primjer.com" (keydown.enter)="submit()" />
      </div>

      <div class="field">
        <label class="label">Lozinka</label>
        <input class="input" [(ngModel)]="password" type="password"
               placeholder="••••••••" (keydown.enter)="submit()" />
      </div>

      <button class="btn btn-primary w-full" (click)="submit()" [disabled]="loading">
        {{ loading ? 'Prijavljivanje...' : 'Prijavi se' }}
      </button>

      <p class="auth-footer">
        Nemate nalog?
        <a routerLink="/register" class="link">Kreirajte nalog</a>
      </p>

    </div>
  </div>
</div>
