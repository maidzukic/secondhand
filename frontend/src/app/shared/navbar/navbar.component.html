<nav class="navbar" [class.navbar--scrolled]="scrolled">
  <div class="navbar__inner">

    
    <a routerLink="/" class="navbar__logo" (click)="closeMenu()">
      <span class="navbar__logo-icon">♻️</span>
      <span class="navbar__logo-text">SecondHand</span>
    </a>

    
    <div class="navbar__links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="navbar__link">Početna</a>

      <ng-container *ngIf="auth.isLoggedIn()">
        <a routerLink="/my-products" routerLinkActive="active" class="navbar__link">Moji oglasi</a>
        <a routerLink="/chats" routerLinkActive="active" class="navbar__link">Chat</a>
        <a routerLink="/orders-buyer" routerLinkActive="active" class="navbar__link">Moje narudžbe</a>
        <a routerLink="/orders-seller" routerLinkActive="active" class="navbar__link">Zahtjevi</a>
        <a routerLink="/favorites" routerLinkActive="active" class="navbar__link">Omiljeni</a>
      </ng-container>
    </div>

    
    <div class="navbar__right">
      <ng-container *ngIf="!auth.isLoggedIn()">
        <a routerLink="/login" class="navbar__link">Prijavite se</a>
        <a routerLink="/register" class="btn-nav btn-nav--primary">Registrirajte se</a>
      </ng-container>

      <ng-container *ngIf="auth.isLoggedIn()">
        <a routerLink="/create" class="btn-nav btn-nav--primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Novi oglas
        </a>

        <a routerLink="/profile" class="navbar__profile-btn"title="Profil">Profil</a>

        <a *ngIf="auth.getUser()?.role === 'admin'" routerLink="/admin" class="navbar__badge-link">Admin</a>

        <button class="navbar__logout" (click)="logout()" title="Logout">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </ng-container>
    </div>

    
    <button class="navbar__burger" (click)="menuOpen = !menuOpen" [class.open]="menuOpen">
      <span></span><span></span><span></span>
    </button>
  </div>

  
  <div class="navbar__mobile" [class.navbar__mobile--open]="menuOpen">
    <a routerLink="/" class="navbar__mobile-link" (click)="closeMenu()">Početna</a>

    <ng-container *ngIf="auth.isLoggedIn()">
      <a routerLink="/create" class="navbar__mobile-link navbar__mobile-link--accent" (click)="closeMenu()">+ Novi oglas</a>
      <a routerLink="/my-products" class="navbar__mobile-link" (click)="closeMenu()">Moji oglasi</a>
      <a routerLink="/chats" class="navbar__mobile-link" (click)="closeMenu()">Chat</a>
      <a routerLink="/orders-buyer" class="navbar__mobile-link" (click)="closeMenu()">Moje narudžbe</a>
      <a routerLink="/orders-seller" class="navbar__mobile-link" (click)="closeMenu()">Zahtjevi</a>
      <a routerLink="/favorites" class="navbar__mobile-link" (click)="closeMenu()">Omiljeni</a>
      <a routerLink="/profile" class="navbar__mobile-link" (click)="closeMenu()">Profil</a>
      <a *ngIf="auth.getUser()?.role === 'admin'" routerLink="/admin" class="navbar__mobile-link" (click)="closeMenu()">Admin</a>
      <button class="navbar__mobile-logout" (click)="logout()">Odjava</button>
    </ng-container>

    <ng-container *ngIf="!auth.isLoggedIn()">
      <a routerLink="/login" class="navbar__mobile-link" (click)="closeMenu()">Prijavite se</a>
      <a routerLink="/register" class="navbar__mobile-link navbar__mobile-link--accent" (click)="closeMenu()">Registrirajte se</a>
    </ng-container>
  </div>
</nav>
